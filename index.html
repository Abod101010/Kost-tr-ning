<style>
/* Layout: mobil app, en kolumn upp till 480px, fyra flikar i en fast bottenmeny */
:root{
  --bg:#F4F6F3; --surface:#FFFFFF; --fg:#16201A; --muted:#5C6A62; --line:#D9E0DA; --line-soft:#E6EBE7;
  --accent:#1F7556; --accent-soft:#E2EFE8; --on-accent:#FFFFFF; --accent-ink:#165A42;
  --target:#B4570F; --target-ink:#8A3F08; --warn:#A3361F;
  --water:#1D5F8C; --water-soft:#EAF1F6; --water-line:#B9CCDA; --water-label:#3E82B3;
  --ink:#16201A; --ink-fg:#F4F6F3; --ink-muted:#A9BBB1; --ink-raised:#263129; --ink-accent:#4FBF92;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1411; --surface:#171E1A; --fg:#E6ECE7; --muted:#9AA89F; --line:#29332D; --line-soft:#222B26;
  --accent:#4FBF92; --accent-soft:#1C3128; --on-accent:#0F1411; --accent-ink:#7AD3AE;
  --target:#E58A45; --target-ink:#F0A56D; --warn:#F07A62;
  --water:#5AA9E0; --water-soft:#16232D; --water-line:#2C4352; --water-label:#8CC4EA;
  --ink:#1F2A24; --ink-fg:#E6ECE7; --ink-muted:#9AA89F; --ink-raised:#2A372F; --ink-accent:#4FBF92; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#171E1A; --fg:#E6ECE7; --muted:#9AA89F; --line:#29332D; --line-soft:#222B26;
  --accent:#4FBF92; --accent-soft:#1C3128; --on-accent:#0F1411; --accent-ink:#7AD3AE;
  --target:#E58A45; --target-ink:#F0A56D; --warn:#F07A62;
  --water:#5AA9E0; --water-soft:#16232D; --water-line:#2C4352; --water-label:#8CC4EA;
  --ink:#1F2A24; --ink-fg:#E6ECE7; --ink-muted:#9AA89F; --ink-raised:#2A372F; --ink-accent:#4FBF92; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:24px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);font-weight:700;text-transform:uppercase;margin:0;line-height:1;text-wrap:balance}
h1{font-size:44px}
h2{font-size:24px;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;flex-direction:column;gap:4px}
.fine{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.ink{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.card.ink .eyebrow,.card.ink .fine{color:var(--ink-muted)}
.rowb{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl{font-size:13px;color:var(--muted);font-weight:500}
.big{font-family:var(--display);font-weight:600;font-size:56px;line-height:.9;font-variant-numeric:tabular-nums}
.mid{font-family:var(--display);font-weight:600;font-size:30px;line-height:1;text-transform:uppercase}
.bar{height:10px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.thin{height:6px}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;border-top:1px solid var(--line);padding-top:12px}
.split>div{display:flex;flex-direction:column;gap:5px;min-width:0}
.mono{font-family:var(--mono);font-size:15px;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;min-height:52px;padding:0 18px;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.water{background:var(--water);color:#FFFFFF;width:auto;min-height:44px;font-size:14px;border-radius:99px;padding:0 16px}
.round{width:44px;height:44px;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.round.lg{width:52px;height:52px;background:var(--bg);font-size:26px}
.linkrow{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-radius:10px;background:var(--ink-raised);color:var(--ink-fg);border:0;font-size:14px;text-align:left;width:100%}
.remind{display:flex;align-items:center;gap:12px;padding:14px;min-height:44px;border:1px dashed var(--target);border-radius:14px;color:var(--target-ink);background:transparent;font-size:14px;text-align:left;width:100%}
.remind.go{border-style:solid;background:var(--target);color:#FFFFFF}
.meals{padding:0;gap:0}
.meal{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:62px;border:0;border-bottom:1px solid var(--line-soft);background:transparent;text-align:left;width:100%}
.meal:last-child{border-bottom:0}
.tick{flex:none;width:26px;height:26px;border-radius:99px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.meal.on .tick{background:var(--accent);border-color:var(--accent)}
.meal .t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.meal .t b{font-size:15px}
.meal .t span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal .k{flex:none;display:flex;flex-direction:column;align-items:flex-end;font-family:var(--mono)}
.meal .k span{font-size:11px;color:var(--muted)}
.bottles{display:flex;justify-content:space-between;gap:2px;flex-wrap:wrap}
.water-num{font-family:var(--display);font-weight:600;font-size:40px;line-height:.9;color:var(--water);font-variant-numeric:tabular-nums}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;font-size:14px;min-height:32px;display:flex;align-items:center}
ul.rules{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
input.in{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mood{min-height:60px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.mood b{font-family:var(--display);font-weight:600;font-size:22px;line-height:1}
.mood span{font-size:11px}
.mood[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.status{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px}
.status.err{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.hist{padding:0;gap:0}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.hrow:last-child{border-bottom:0}
.hrow .d{display:flex;flex-direction:column;min-width:0}
.hrow .d span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .w{font-family:var(--mono);text-align:right;display:flex;flex-direction:column}
.hrow .w span{font-size:12px}
.del{border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;border-radius:8px;min-height:36px;padding:0 10px}
.del.confirm{border-color:var(--warn);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--fg);border-bottom:1px solid var(--line)}
.stats>div{padding:10px 8px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats>div:first-child{padding-left:0}
.stats>div+div{border-left:1px solid var(--line)}
.stats b{font-family:var(--display);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line-soft)}
.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--target);color:var(--target-ink);white-space:nowrap;margin-left:6px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--fg);min-width:0}
.wd .a{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.wd .b{font-family:var(--display);font-weight:600;font-size:15px;line-height:1}
.wd.lift{background:var(--accent-soft);color:var(--accent-ink)}
.wd.rest{color:var(--muted)}
.wd.today{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:44px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ex{gap:10px}
.ex .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex .top b{font-size:15px}
.ex .top span{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.sets{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.kg input{width:74px;min-height:44px;padding:8px;font-family:var(--mono)}
.set{min-width:58px;min-height:44px;padding:4px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:var(--mono);font-size:13px;font-weight:500}
.set[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.verdict{display:flex;flex-direction:column;gap:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{border:0;background:transparent;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:448px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;z-index:6}

/* Profiler */
.who{display:flex;justify-content:space-between;align-items:center;gap:12px}
.who-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px}
.who-btns button{border:0;background:transparent;border-radius:99px;min-height:38px;padding:0 16px;font-size:14px;font-weight:600;color:var(--muted)}
.who-btns button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
:root[data-profile="cassie"]{--accent:#8C3A62;--accent-soft:#F4E6ED;--accent-ink:#6E2C4C;--on-accent:#FFFFFF;--ink-accent:#E89BC0}
@media (prefers-color-scheme:dark){:root[data-profile="cassie"]:not([data-theme="light"]){--accent:#E08AB3;--accent-soft:#3A2130;--accent-ink:#F0B3CF;--on-accent:#1A0F14;--ink-accent:#E08AB3}}
:root[data-theme="dark"][data-profile="cassie"]{--accent:#E08AB3;--accent-soft:#3A2130;--accent-ink:#F0B3CF;--on-accent:#1A0F14;--ink-accent:#E08AB3}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>html{padding-top:env(safe-area-inset-top,0px)}body{margin:0;-webkit-text-size-adjust:100%}</style>
</head>

const KEY = "formplan-data-v1";
function blank() { return { weighins: {}, months: {}, days: {}, workouts: {} }; }
function seed(pid, p) {
  const s = PROFILES[pid].start;
  if (!Object.keys(p.weighins).length) p.weighins[s.date] = { date: s.date, kg: s.kg, mood: 3, note: "Startvikt" };
  if (!Object.keys(p.months).length) {
    const m = macrosFor(PROFILES[pid].kcal, PROFILES[pid].protein);
    p.months["2026-10"] = { kcal: PROFILES[pid].kcal, protein: m.p, fat: m.f, carbs: m.c, setOn: s.date };
  }
}
function normalize(raw) {
  let st;
  if (raw && raw.v === 2 && raw.p) st = raw;
  else if (raw && raw.weighins) st = { v: 2, active: "abbe", p: { abbe: { weighins: raw.weighins || {}, months: raw.months || {}, days: raw.days || {}, workouts: raw.workouts || {} } } };
  else st = { v: 2, active: "abbe", p: {} };
  Object.keys(PROFILES).forEach(pid => {
    const p = st.p[pid] || (st.p[pid] = blank());
    ["weighins", "months", "days", "workouts"].forEach(c => { if (!p[c] || typeof p[c] !== "object") p[c] = {}; });
    seed(pid, p);
  });
  if (!PROFILES[st.active]) st.active = "abbe";
  return st;
}
let store;
try { store = normalize(JSON.parse(localStorage.getItem(KEY))); } catch (e) { store = normalize(null); }
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); return true; }
  catch (e) { toast("Kunde inte spara. Telefonens lagring kan vara full."); return false; }
}
persist();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

const P = () => PROFILES[store.active];
const D = () => store.p[store.active];
function setDoc(col, id, data) { D()[col][id] = JSON.parse(JSON.stringify(data)); persist(); }

}

const fint = n => Number(n).toLocaleString("sv-SE");
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

const parse = s => new Date(s + "T12:00:00");
const ddiff = (a, b) => Math.round((Date.parse(b + "T12:00:00Z") - Date.parse(a + "T12:00:00Z")) / 864e5);

const signed = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "±") + fmt(Math.abs(v), d);

function macrosFor(kcal, protein) {
  const f = Math.round(kcal * 0.28 / 9 / 5) * 5;
  const c = Math.max(0, Math.round((kcal - protein * 4 - f * 9) / 4 / 5) * 5);

function kcalFor(key) {

/* ---------- Framsteg ---------- */
function trend() {
  const ents = entries();
  if (ents.length < 2) return null;
  const last = ents[ents.length - 1];
  const win = ents.filter(e => ddiff(e.date, last.date) <= 28);
  if (win.length < 2 || ddiff(win[0].date, last.date) < 14) return null;
  const xs = win.map(e => ddiff(win[0].date, e.date)), ys = win.map(e => e.kg);
  const mx = xs.reduce((a, b) => a + b, 0) / xs.length, my = ys.reduce((a, b) => a + b, 0) / ys.length;
  let num = 0, den = 0; xs.forEach((x, i) => { num += (x - mx) * (ys[i] - my); den += (x - mx) ** 2; });
  const moods = win.map(e => e.mood).filter(Boolean);
  const md = id => { const w = win.filter(e => e[id]); return w.length >= 2 ? w[w.length - 1][id] - w[0][id] : null; };
  return {
    perWeek: -(num / den) * 7,
    mood: moods.length ? moods.reduce((a, b) => a + b, 0) / moods.length : 3,
    waistDelta: md("waist"), hipDelta: md("hip")
  };
}
function suggest() {
  const pr = P(), r = pr.rule, t = trend(), cur = kcalFor(monthKey(today()));
  if (!t) return { kind: "wait", cur };
  let kcal = cur, kind = "keep", why;
  if (t.mood <= 2) { kcal = cur + r.step; kind = "up"; why = "Måendet har legat lågt. Mer energi skyddar träningen och musklerna."; }
  else if (t.perWeek > r.max) { kcal = cur + r.step; kind = "up"; why = "Du går ner snabbare än " + fmt(r.max) + " kg i veckan, vilket riskerar muskelmassa."; }
  else if (t.perWeek < r.min) {
    if (t.waistDelta !== null && t.waistDelta <= -1) why = "Vikten rör sig långsamt men midjan har minskat" + (t.hipDelta !== null && t.hipDelta > 0 ? " och stussen ökat" : "") + ". Det fungerar, behåll nivån.";
    else { kcal = Math.max(r.floor, cur - r.step); kind = kcal < cur ? "down" : "keep"; why = kcal < cur ? "Trenden är under " + fmt(r.min) + " kg i veckan och midjan står still." : "Du är redan på " + fint(r.floor) + " kcal. Öka stegen med 2 000 per dag i stället."; }
  } else why = "Tempot ligger i rätt intervall. Fortsätt som nu.";
  return { kind, kcal, cur, why, t };
}
function chart() {
  const pr = P(), S = pr.start, ents = entries();
  const W = 360, H = 210, L = 30, R = 10, T = 12, B = 26;
  const total = ddiff(S.date, END);
  const pts = ents.map(e => ({ x: ddiff(S.date, e.date), y: e.kg }));
  const endLow = S.kg - pr.high * total / 7, endHigh = S.kg - pr.low * total / 7, endT = S.kg - pr.rate * total / 7;
  const ymin = Math.floor(Math.min(endLow, ...pts.map(p => p.y)) - 0.5), ymax = Math.ceil(Math.max(S.kg, ...pts.map(p => p.y)) + 0.5);
  const sx = x => L + (x / total) * (W - L - R), sy = y => T + (ymax - y) / (ymax - ymin) * (H - T - B);
  const stepY = ymax - ymin > 8 ? 2 : 1;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vikt över tid mot mållinjen">`;
  s += `<polygon points="${sx(0)},${sy(S.kg)} ${sx(total)},${sy(endHigh)} ${sx(total)},${sy(endLow)}" fill="var(--line-soft)"/>`;
  for (let y = ymin; y <= ymax; y++) {
    s += `<line x1="${L}" x2="${W - R}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--line)" stroke-width=".7"/>`;
    if ((ymax - y) % stepY === 0) s += `<text x="${L - 6}" y="${sy(y) + 3.5}" text-anchor="end">${y}</text>`;
  }
  [[S.date, shortDate(S.date)], ["2026-11-01", "1 nov"], ["2026-12-01", "1 dec"], ["2027-01-01", "1 jan"]].forEach(([dd, l], i, a) => {
    const x = sx(ddiff(S.date, dd));
    if (i > 0 && i < a.length - 1) s += `<line x1="${x}" x2="${x}" y1="${T}" y2="${H - B}" stroke="var(--line)" stroke-dasharray="2 3"/>`;
    s += `<text x="${x}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === a.length - 1 ? "end" : "middle"}">${l}</text>`;
  });
  s += `<line x1="${sx(0)}" y1="${sy(S.kg)}" x2="${sx(total)}" y2="${sy(endT)}" stroke="var(--target)" stroke-width="2" stroke-dasharray="6 4"/>`;
  s += `<text x="${sx(total) - 2}" y="${sy(endT) - 8}" text-anchor="end" style="fill:var(--target-ink)">${fmt(endT)}</text>`;
  if (pts.length > 1) s += `<polyline points="${pts.map(p => sx(p.x) + "," + sy(p.y)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p, i) => { const last = i === pts.length - 1; s += `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="${last ? 5.5 : 3.5}" fill="${last ? "var(--accent)" : "var(--surface)"}" stroke="${last ? "var(--surface)" : "var(--accent)"}" stroke-width="2"/>`; });
  return s + "</svg>";
}
function measureCard(m) {
  const list = entries().filter(e => e[m.id]);
  let body;
  if (!list.length) body = `<p class="fine">Inget mått än. Lägg in det vid nästa vägning.</p>`;
  else if (list.length === 1) body = `<p><span class="mono">${fmt(list[0][m.id])} cm</span> <span class="fine">den ${shortDate(list[0].date)}. Nästa mått visar förändringen.</span></p>`;
  else {
    const dlt = list[list.length - 1][m.id] - list[0][m.id];
    const good = m.good === "down" ? dlt < 0 : dlt > 0;
    body = `<p><span class="mid" style="font-size:28px;color:${dlt === 0 ? "var(--fg)" : good ? "var(--accent)" : "var(--target-ink)"}">${signed(dlt)} cm</span> <span class="fine">sedan ${shortDate(list[0].date)} · nu ${fmt(list[list.length - 1][m.id])} cm</span></p>`;
  }
  return `<div class="card"><div class="rowb"><b style="font-size:13px">${m.label}</b><span class="fine" style="font-size:11px">${m.good === "down" ? "Mål: minska" : "Mål: öka"}</span></div>${body}</div>`;
}
function renderFramsteg() {
  const pr = P(), t = today(), ents = entries(), last = ents[ents.length - 1];
  const endT = pr.start.kg - pr.rate * ddiff(pr.start.date, END) / 7;
  const lost = last ? pr.start.kg - last.kg : 0;
  const sg = suggest(), nk = nextMonthKey(monthKey(t)), r = pr.rule, months = D().months;
  const already = months[nk] && months[nk].kcal === (sg.kind === "wait" ? sg.cur : sg.kcal);
  const head = sg.kind === "wait" ? "Fortsätt med " + fint(sg.cur) + " kcal" : sg.kind === "keep" ? "Behåll " + fint(sg.cur) + " kcal" : (sg.kind === "down" ? "Sänk till " : "Höj till ") + fint(sg.kcal) + " kcal";
  const mtxt = sg.t ? (sg.t.waistDelta !== null ? ", midja " + signed(sg.t.waistDelta) + " cm" : "") + (sg.t.hipDelta !== null ? ", stuss " + signed(sg.t.hipDelta) + " cm" : "") : "";
  const body = sg.kind === "wait" ? "Förslaget räknas fram när det finns två vägningar med minst två veckors mellanrum."
    : "Trend: " + fmt(Math.abs(sg.t.perWeek), 2) + " kg " + (sg.t.perWeek >= 0 ? "ner" : "upp") + " per vecka, mående i snitt " + fmt(sg.t.mood) + mtxt + ". " + sg.why;
  const showApply = sg.kind !== "wait" && nk <= "2026-12";
  return `${switcher()}
  <div class="head"><div class="eyebrow">${Math.max(0, ddiff(t, END))} dagar kvar till 1 jan</div><h1>Framsteg</h1>
    ${pr.focus ? `<p class="fine" style="margin-top:4px">${pr.focus}</p>` : ""}</div>

  <div class="stats">
    <div><span>Start ${shortDate(pr.start.date)}</span><b>${fmt(pr.start.kg)}</b><span>kg</span></div>
    <div><span>Senast${last ? " " + shortDate(last.date) : ""}</span><b>${last ? fmt(last.kg) : "–"}</b><span>${last && lost ? signed(-lost) + " kg totalt" : "kg"}</span></div>
    <div><span>Mål 1 jan</span><b style="color:var(--target-ink)">≈ ${fmt(endT)}</b><span>${fint(pr.rate)} kg / vecka</span></div>
  </div>

  ${pr.measures.length > 1 ? `<div class="grid2">${pr.measures.map(measureCard).join("")}</div>` : ""}

  <div class="card" style="padding:14px 10px 12px">
    <div class="rowb" style="padding:0 4px"><b style="font-size:13px">Vikt</b><span class="fine" style="font-size:11px">${ents.length} ${ents.length === 1 ? "vägning" : "vägningar"}</span></div>
    ${chart()}
    <div class="legend" style="padding:0 4px">
      <span><i style="width:10px;height:10px;border-radius:99px;background:var(--accent)"></i>Vikt</span>
      <span><i style="width:14px;border-top:2px dashed var(--target)"></i>Mål ${pr.rateNote}</span>
      <span><i style="width:12px;height:8px;background:var(--line-soft);border:1px solid var(--line)"></i>${fint(pr.low)}–${fint(pr.high)} kg/v</span>
    </div>
  </div>

  ${pr.measures.length === 1 ? measureCard(pr.measures[0]) : ""}

  <div class="card ink verdict">
    <div class="rowb"><span class="eyebrow">Månadskoll 1 ${monthName(nk).slice(0, 3)}</span><span class="fine" style="font-size:11px">om ${Math.max(0, ddiff(t, nk + "-01"))} dagar</span></div>
    <div class="mid" style="font-size:26px">${head}</div>
    <p class="fine" style="color:var(--ink-muted)">${esc(body)}</p>
    ${showApply ? `<button type="button" class="btn" data-act="apply" data-kcal="${sg.kcal}" ${already ? "disabled" : ""}>${already ? "Sparat för " + monthName(nk) : "Spara " + fint(sg.kcal) + " kcal för " + monthName(nk)}</button>` : ""}
    ${applyMsg ? `<p class="fine" style="color:var(--ink-muted)">${esc(applyMsg)}</p>` : ""}
  </div>

  <div class="card">
    <b style="font-size:13px">Kalorinivå per månad</b>
    <table><thead><tr><th>Period</th><th class="r">Kcal</th><th class="r">P</th><th class="r">F</th><th class="r">K</th></tr></thead><tbody>
    ${["2026-10", "2026-11", "2026-12"].map(k => { const kc = kcalFor(k), m = macrosFor(kc, pr.protein); return `<tr><td>${k === "2026-10" ? Number(pr.start.date.slice(8)) + "–31 okt" : monthName(k)}${!months[k] ? '<span class="chip">sätts den 1:a</span>' : ""}</td><td class="r">${fint(kc)}</td><td class="r">${m.p}</td><td class="r">${m.f}</td><td class="r">${m.c}</td></tr>`; }).join("")}
    </tbody></table>
    <p class="fine" style="font-size:12px">Under ${fint(r.min)} kg/v (och midjan står still) sänks ${r.step} kcal, aldrig under ${fint(r.floor)}. Över ${fint(r.max)} kg/v eller mående 2 eller lägre höjs ${r.step} kcal.</p>
  </div>

  <div class="card">
    <b style="font-size:13px">Säkerhetskopia</b>
    <p class="fine">Allt sparas bara i den här telefonen, för båda profilerna. Spara en kopia ibland, så kan du läsa in den igen om du byter telefon eller rensar webbläsaren.</p>
    <div class="grid2">
      <button type="button" class="btn" data-act="export" style="min-height:46px;font-size:14px">Spara kopia</button>
      <label class="btn" for="import-file" style="min-height:46px;font-size:14px;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--accent);border:1px solid var(--accent);cursor:pointer">Läs in kopia</label>
    </div>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
  </div>`;
}

/* ---------- Träning ---------- */
const workoutId = (date, pass) => date + "_" + pass;
function lastKg(pass, exId, before) {
  const list = Object.values(D().workouts).filter(w => w.pass === pass && w.date < before && w.kg && w.kg[exId] != null).sort((a, b) => a.date < b.date ? 1 : -1);
  return list.length ? list[0].kg[exId] : null;
}
function renderTraning() {
  const pr = P(), t = today(), d = parse(t), plan = dayPlan(t), keys = Object.keys(pr.passes);
  if (!trainPass || !pr.passes[trainPass]) {
    trainPass = keys[0];
    if (plan.kind === "lift") trainPass = plan.pass;
    else for (let i = 1; i < 7; i++) { const p = dayPlan(addDays(t, i)); if (p.kind === "lift") { trainPass = p.pass; break; } }
  }
  const PS = pr.passes[trainPass], w = D().workouts[workoutId(t, trainPass)] || { done: {}, kg: {} };
  let doneSets = 0, totalSets = 0;
  PS.ex.forEach(ex => { for (let i = 0; i < ex.n; i++) { totalSets++; if (w.done && w.done[ex.id + "-" + i]) doneSets++; } });
  const order = [1, 2, 3, 4, 5, 6, 0], mondayOffset = (d.getDay() + 6) % 7;
  const prevSession = Object.values(D().workouts).filter(x => x.pass === trainPass && x.date < t).sort((a, b) => a.date < b.date ? 1 : -1)[0];
  return `${switcher()}
  <div class="head"><div class="eyebrow">${WDAYS[d.getDay()]} ${shortDate(t)} · Idag: ${plan.label}</div><h1>Pass ${trainPass} · ${PS.name}</h1></div>

  <div class="week">${order.map((wd, i) => { const p = pr.week[wd]; const date = addDays(t, i - mondayOffset); return `<div class="wd ${date === t ? "today" : p.kind === "lift" ? "lift" : p.kind === "rest" ? "rest" : ""}"><span class="a">${WDAYS[wd].slice(0, 3)}</span><span class="b">${p.tag}</span></div>`; }).join("")}</div>

  <div class="seg" role="group" aria-label="Välj pass" style="grid-template-columns:repeat(${keys.length},minmax(0,1fr))">${keys.map(k => `<button type="button" data-pass="${k}" aria-pressed="${trainPass === k}">Pass ${k}</button>`).join("")}</div>

  <div class="rowb fine"><span>${doneSets} av ${totalSets} set klara idag</span><span>${prevSession ? "Förra: " + shortDate(prevSession.date) : "Första gången"}</span></div>
  <div class="bar thin"><i style="width:${totalSets ? doneSets / totalSets * 100 : 0}%"></i></div>

  ${PS.ex.map(ex => {
    const cur = w.kg && w.kg[ex.id] != null ? w.kg[ex.id] : null;
    const prev = lastKg(trainPass, ex.id, t);
    const val = cur != null ? cur : prev != null ? prev : "";
    return `<div class="card ex">
      <div class="top"><b>${ex.name}</b><span>${ex.scheme}</span></div>
      <div class="sets">
        ${ex.nokg ? "" : `<label class="kg" for="kg-${ex.id}"><input class="in" id="kg-${ex.id}" data-kg="${ex.id}" type="text" inputmode="decimal" value="${val === "" ? "" : fmt(val, val % 1 ? 1 : 0)}" placeholder="–" aria-label="${ex.name} vikt i kg">kg</label>`}
        ${Array.from({ length: ex.n }, (_, i) => { const on = !!(w.done && w.done[ex.id + "-" + i]); return `<button type="button" class="set" data-set="${ex.id}-${i}" aria-pressed="${on}" aria-label="${ex.name} set ${i + 1}${on ? ", klart" : ""}">${on ? "✓" : "Set " + (i + 1)}</button>`; }).join("")}
      </div>
      ${prev != null && !ex.nokg ? `<span class="fine" style="font-size:12px">Förra passet: ${fmt(prev, prev % 1 ? 1 : 0)} kg</span>` : ""}
    </div>`;
  }).join("")}

  <div class="card">
    <b style="font-size:13px">Progression</b>
    <ul class="rules" style="margin:0">${pr.progression.map(r => `<li>${r}</li>`).join("")}</ul>
  </div>`;
}

/* ---------- Render och händelser ---------- */
function render(force) {
  const ae = document.activeElement;
  if (!force && ae && ae.tagName === "INPUT" && $("#view").contains(ae)) { deferred = true; return; }
  deferred = false;
  document.documentElement.dataset.profile = store.active;
  $("#view").innerHTML = tab === "idag" ? renderIdag() : tab === "logga" ? renderLogga() : tab === "framsteg" ? renderFramsteg() : renderTraning();
  document.querySelectorAll("nav.tabs button").forEach(b => { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
}
function go(t) { tab = t; form.msg = ""; applyMsg = ""; render(true); window.scrollTo(0, 0); }
function switchProfile(pid) {
  if (!PROFILES[pid] || pid === store.active) return;
  store.active = pid; persist();
  trainPass = null; pendingDel = null; form = { kg: null, mood: 4, msg: "", err: false }; applyMsg = "";
  render(true);
}

document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) go(b.dataset.tab); });
document.addEventListener("focusout", () => setTimeout(() => { if (deferred) render(); }, 0));

function exportData() {
  const blob = new Blob([JSON.stringify(store, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "formplan-backup-" + today() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Säkerhetskopian är sparad i Hämtade filer.");
}

$("#view").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const t = today(), pr = P();
  if (b.dataset.profile) return switchProfile(b.dataset.profile);
  if (b.dataset.go) return go(b.dataset.go);
  if (b.dataset.act === "export") return exportData();
  if (b.dataset.pass !== undefined && b.dataset.pass !== "") { trainPass = b.dataset.pass; if (tab !== "traning") go("traning"); else render(true); return; }
  if (b.dataset.meal) {
    const doc = dayDoc(t), meals = Object.assign({}, doc.meals || {});
    meals[b.dataset.meal] = !meals[b.dataset.meal];
    setDoc("days", t, { date: t, meals, bottles: doc.bottles || 0 }); return render(true);
  }
  const act = b.dataset.act;
  if (act === "bottle+" || act === "bottle-") {
    const doc = dayDoc(t), n = Math.max(0, Math.min(20, (doc.bottles || 0) + (act === "bottle+" ? 1 : -1)));
    setDoc("days", t, { date: t, meals: Object.assign({}, doc.meals || {}), bottles: n }); return render(true);
  }
  if (act === "kg+" || act === "kg-") { form.kg = Math.max(300, Math.min(2000, form.kg + (act === "kg+" ? 1 : -1))); form.msg = ""; return render(true); }
  if (b.dataset.mood) { form.mood = Number(b.dataset.mood); form.msg = ""; return render(true); }
  if (act === "save-week") {
    const data = { date: t, kg: form.kg / 10, mood: form.mood, note: $("#f-note").value.trim().slice(0, 200) };
    for (const m of pr.measures) {
      const raw = $("#f-" + m.id).value.replace(",", ".").trim();
      const v = raw ? parseFloat(raw) : null;
      if (v !== null && !(v >= 40 && v <= 180)) { form.msg = "Skriv " + m.label.toLowerCase() + "måttet i cm, till exempel " + m.ph.replace("t.ex. ", "") + "."; form.err = true; return render(true); }
      data[m.id] = v === null ? null : Math.round(v * 2) / 2;
    }
    const stepsRaw = $("#f-steps").value.replace(/\s/g, "");
    const steps = stepsRaw ? parseInt(stepsRaw, 10) : null;
    if (steps !== null && !(steps >= 0 && steps <= 60000)) { form.msg = "Skriv stegen som ett heltal, till exempel 8500."; form.err = true; return render(true); }
    data.steps = steps;
    setDoc("weighins", t, data);
    form.msg = "Sparat för " + shortDate(t) + ". Trenden uppdateras i Framsteg."; form.err = false;
    return render(true);
  }
  if (b.dataset.del) {
    const id = b.dataset.del;
    if (pendingDel !== id) { pendingDel = id; render(true); setTimeout(() => { if (pendingDel === id) { pendingDel = null; render(); } }, 4000); return; }
    pendingDel = null; delDoc("weighins", id); return render(true);
  }
  if (act === "apply") {
    const kcal = Number(b.dataset.kcal), nk = nextMonthKey(monthKey(t)), m = macrosFor(kcal, pr.protein);
    setDoc("months", nk, { kcal, protein: m.p, fat: m.f, carbs: m.c, setOn: t });
    applyMsg = "Sparat. Nivån gäller från 1 " + monthName(nk) + "."; return render(true);
  }
  if (b.dataset.set) {
    const wid = workoutId(t, trainPass), w = D().workouts[wid] || { date: t, pass: trainPass, done: {}, kg: {} };
    const done = Object.assign({}, w.done || {}); done[b.dataset.set] = !done[b.dataset.set];
    setDoc("workouts", wid, { date: t, pass: trainPass, done, kg: Object.assign({}, w.kg || {}) }); return render(true);
  }
});
$("#view").addEventListener("change", e => {
  if (e.target.id === "import-file" && e.target.files[0]) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const raw = JSON.parse(rd.result);
        if (!raw || typeof raw !== "object" || !(raw.p || raw.weighins)) throw 0;
        store = normalize(raw); persist(); trainPass = null; form.kg = null; render(true);
        toast("Säkerhetskopian är inläst.");
      } catch (err) { toast("Filen gick inte att läsa. Välj en formplan-backup (.json)."); }
    };
    rd.readAsText(e.target.files[0]);
    return;
  }
  const inp = e.target.closest("input[data-kg]"); if (!inp) return;
  const t = today(), wid = workoutId(t, trainPass), w = D().workouts[wid] || { date: t, pass: trainPass, done: {}, kg: {} };
  const raw = inp.value.replace(",", ".").trim(), v = raw === "" ? null : parseFloat(raw);
  if (v !== null && !(v >= 0 && v <= 500)) { toast("Skriv vikten i kg, till exempel 52,5."); return; }
  const kg = Object.assign({}, w.kg || {}); if (v === null) delete kg[inp.dataset.kg]; else kg[inp.dataset.kg] = Math.round(v * 4) / 4;
  setDoc("workouts", wid, { date: t, pass: trainPass, done: Object.assign({}, w.done || {}), kg });
});

render(true);
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
</script>
